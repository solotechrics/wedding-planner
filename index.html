<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wedding List</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">
  <main class="max-w-3xl mx-auto p-4 sm:p-6">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-semibold">Wedding List</h1>
      <button id="whoami" class="text-sm underline text-stone-600"></button>
    </header>

    <nav class="flex gap-2 mb-4">
      <button data-view="mine" class="tab px-4 py-2 rounded-lg text-sm">My list</button>
      <button data-view="merged" class="tab px-4 py-2 rounded-lg text-sm">Merged list</button>
    </nav>

    <form id="itemForm" class="bg-white border border-stone-200 rounded-xl p-4 mb-4 grid gap-3 sm:grid-cols-[1fr_9rem_auto]">
      <input id="name" required placeholder="Item name" class="border border-stone-300 rounded-lg px-3 py-2" />
      <input id="price" required type="number" min="0" step="any" placeholder="Price (₦)" class="border border-stone-300 rounded-lg px-3 py-2" />
      <div class="flex gap-2">
        <button id="saveBtn" class="bg-stone-800 text-white rounded-lg px-4 py-2">Add item</button>
        <button id="cancelBtn" type="button" class="hidden border border-stone-300 rounded-lg px-4 py-2">Cancel</button>
      </div>
    </form>

    <section class="bg-white border border-stone-200 rounded-xl p-4 mb-4 grid gap-3 sm:grid-cols-5">
      <input id="q" placeholder="Search name" class="sm:col-span-2 border border-stone-300 rounded-lg px-3 py-2" />
      <input id="min" type="number" min="0" placeholder="Min ₦" class="border border-stone-300 rounded-lg px-3 py-2" />
      <input id="max" type="number" min="0" placeholder="Max ₦" class="border border-stone-300 rounded-lg px-3 py-2" />
      <select id="sort" class="border border-stone-300 rounded-lg px-3 py-2">
        <option value="newest">Newest</option>
        <option value="name">Name A–Z</option>
        <option value="priceAsc">Price low–high</option>
        <option value="priceDesc">Price high–low</option>
      </select>
      <select id="fOwner" class="hidden sm:col-span-5 border border-stone-300 rounded-lg px-3 py-2"></select>
    </section>

    <section class="bg-white border border-stone-200 rounded-xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-stone-100 text-left text-stone-600">
            <tr>
              <th class="p-3">ID</th><th class="p-3">Name</th>
              <th id="ownerCol" class="p-3 hidden">Added by</th>
              <th class="p-3 text-right">Price</th><th class="p-3"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="hidden p-6 text-center text-stone-500">No items yet. Add your first one above.</p>
    </section>

    <section id="totals" class="mt-4 bg-white border border-stone-200 rounded-xl p-4 text-sm space-y-1"></section>
    <p id="error" class="mt-3 text-sm text-red-600"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
